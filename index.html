<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1a9bd0;
    --green:#1b3a1f;
    --olive:#6b8a3a;
    --ink:#222;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Lora',Georgia,'Times New Roman',serif;
    line-height:1.55;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  main{
    width:100%;
    max-width:720px;
    padding:clamp(20px,5vw,48px) clamp(18px,5vw,40px) 40px;
    text-align:center;
  }

  /* Logo */
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,24px)}
  .logo svg.pyr{width:clamp(110px,26vw,190px);height:auto;flex:none}
  .logo .divider{width:2px;align-self:stretch;background:var(--blue);opacity:.9}
  .logo .name{
    font-family:'Playfair Display',Georgia,serif;
    font-weight:800;
    color:var(--blue);
    text-align:left;
    font-size:clamp(30px,8.2vw,56px);
    line-height:1;
    letter-spacing:-.5px;
  }
  .tagline{
    color:var(--blue);
    font-size:clamp(15px,3.6vw,22px);
    letter-spacing:.14em;
    font-family:'Lora',Georgia,serif;
  }

  /* Title */
  .cabin{
    display:flex;align-items:center;gap:clamp(10px,3vw,24px);
    margin:clamp(22px,5vw,38px) 0 clamp(18px,4vw,28px);
  }
  .cabin::before,.cabin::after{content:"";flex:1;height:2px;background:var(--olive);opacity:.8}
  .cabin h1{
    font-family:'Playfair Display',Georgia,serif;
    font-weight:800;
    color:var(--green);
    font-size:clamp(34px,9vw,64px);
    line-height:1.05;
    white-space:nowrap;
  }

  p{font-size:clamp(16px,3.5vw,21px);max-width:34em;margin-inline:auto}
  h2{
    font-family:'Playfair Display',Georgia,serif;
    color:var(--green);
    font-size:clamp(21px,5vw,32px);
    line-height:1.25;
    margin:clamp(20px,4vw,30px) auto clamp(10px,2vw,14px);
  }
  .cta{
    font-family:'Playfair Display',Georgia,serif;
    color:var(--green);
    font-size:clamp(22px,5.4vw,34px);
    font-weight:700;
    margin:clamp(22px,5vw,34px) 0 10px;
  }
  .thanks{margin-bottom:clamp(20px,4vw,30px)}

  /* Review buttons */
  .links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    margin:8px auto 0;
    max-width:620px;
  }
  .link{
    flex:0 1 calc(33.333% - 10px);
    min-width:140px;
    min-height:116px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:18px 10px;
    border:2px solid #e3eadb;
    border-radius:18px;
    background:#fff;
    color:var(--green);
    text-decoration:none;
    font-weight:500;
    font-size:clamp(15px,3.4vw,18px);
    box-shadow:0 2px 8px rgba(27,58,31,.06);
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .link svg{width:46px;height:46px}
  .link:hover,.link:focus-visible{
    transform:translateY(-3px);
    border-color:var(--olive);
    box-shadow:0 8px 20px rgba(27,58,31,.15);
    outline:none;
  }
  .link:active{transform:scale(.98)}

  /* Languages */
  .langs{
    display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;
    margin:0 0 clamp(18px,4vw,28px);
    padding-bottom:14px;
    border-bottom:2px solid var(--olive);
  }
  .langs button{
    font:inherit;
    font-size:clamp(15px,3.4vw,19px);
    color:var(--green);
    background:none;border:0;cursor:pointer;
    padding:8px 12px;border-radius:999px;
  }
  .langs button + button::before{content:"·";margin-right:16px;margin-left:-4px;color:var(--green);pointer-events:none}
  .langs button[aria-pressed="true"]{background:var(--green);color:#fff}
  .langs button[aria-pressed="true"]::before{color:transparent}
  .langs button:hover{text-decoration:underline}
  .langs button[aria-pressed="true"]:hover{text-decoration:none}
  .langs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  @media (max-width:420px){
    .links{gap:12px}
    .link{flex:0 1 calc(50% - 6px);min-width:0;min-height:104px}
    .langs button + button::before{display:none}
  }
</style>
</head>

<script>
(function () {
  var T = {
    es: {

    },
    en: {

      tagline: "Your home away from home",

      headline: "Your opinion is our best gift.",
      p2: "Your feedback helps us keep improving, and by sharing your experience you let other travelers discover this special corner of the Maya Jungle.",
      cta: "Share your experience!",
      thanks: "Thank you for choosing us. We hope to see you soon!",
      nav: "Reviews"
    },
    fr: {
      title: "Cabaña Yaxché · Cabañas Aldea Maya",
      tagline: "Votre maison loin de chez vous",
      p1: "À Cabañas Aldea Maya, nous nous efforçons chaque jour de vous offrir un séjour confortable, agréable et inoubliable, où vous pourrez vous sentir comme chez vous et profiter de la beauté de la Selva Maya.",

      p2: "Vos commentaires nous aident à nous améliorer et, en partageant votre expérience, vous permettez à d'autres voyageurs de découvrir ce coin spécial de la Selva Maya.",
      cta: "Partagez votre expérience !",
      thanks: "Merci de nous avoir choisis. Nous espérons vous revoir bientôt !",
      nav: "Avis"
    },
    de: {
      title: "Cabaña Yaxché · Cabañas Aldea Maya",
      tagline: "Ihr Zuhause fern der Heimat",
      p1: "In den Cabañas Aldea Maya bemühen wir uns jeden Tag, Ihnen einen komfortablen, angenehmen und unvergesslichen Aufenthalt zu bieten, bei dem Sie sich wie zu Hause fühlen und die Schönheit des Maya-Dschungels genießen können.",

      thanks: "Danke, dass Sie sich für uns entschieden haben. Wir freuen uns auf ein baldiges Wiedersehen!",

      tagline: "Dit hjem væk fra hjemmet",
      p1: "På Cabañas Aldea Maya gør vi hver dag vores bedste for at give dig et behageligt, rart og uforglemmeligt ophold, hvor du kan føle dig hjemme og nyde skønheden i Maya-junglen.",
      headline: "Din mening er vores bedste gave.",
      p2: "Dine kommentarer hjælper os med at blive bedre, og når du deler din oplevelse, lader du andre rejsende opdage dette særlige hjørne af Maya-junglen.",
      cta: "Del din oplevelse!",
      thanks: "Tak fordi du valgte os. Vi glæder os til at se dig snart!",
      nav: "Anmeldelser"
    }
  };

  var SUPPORTED = Object.keys(T);
  var DEFAULT = "en";   // idioma si el visitante usa uno no disponible

  function detect() {
    // 1) ?lang=xx  2) elección guardada  3) idioma del navegador/país
    try {
      var q = new URLSearchParams(location.search).get("lang");
      if (q && SUPPORTED.indexOf(q.slice(0, 2).toLowerCase()) > -1) return q.slice(0, 2).toLowerCase();
    } catch (e) {}
    try {
      var saved = localStorage.getItem("aldea-lang");
      if (saved && SUPPORTED.indexOf(saved) > -1) return saved;
    } catch (e) {}
    var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || DEFAULT];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(code) > -1) return code;
    }
    return DEFAULT;
  }

  function apply(lang, persist) {
    var d = T[lang] || T[DEFAULT];
    document.documentElement.lang = lang;
    document.title = d.title;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (d[k]) el.textContent = d[k];
    });
    var nav = document.querySelector(".links");
    if (nav) nav.setAttribute("aria-label", d.nav);
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
    });
    if (persist) { try { localStorage.setItem("aldea-lang", lang); } catch (e) {} }
  }

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.dataset.lang, true); });
  });

  apply(detect(), false);
})();
</script>
